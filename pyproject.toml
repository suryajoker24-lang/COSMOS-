[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-exoplanet-detector"
version = "2.0.0"
description = "AI-based detection and characterisation of transit-like signals in Kepler photometry"
authors = [{ name = "COSMOS Team" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "astropy>=6.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "joblib>=1.3",
    "astroquery>=0.4.7",
    "wotan>=1.10"
]

[project.scripts]
cosmos = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
